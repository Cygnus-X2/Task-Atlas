<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Niklas - Tasks</title>
  <link rel="stylesheet" href="./assets/css/app.css" />
  <script src="./assets/js/app.js" defer></script>
</head>
<body>
  <header>
    <h1>Niklas - Tasks</h1>
    <div class="header-actions">
      <button id="btnAddTask" class="btn-ghost" type="button">+ Add task</button>
      <button id="btnAddTeam" class="btn-ghost" type="button">+ Add team</button>
      <button id="btnImport" class="btn-ghost" type="button">↑ Import CSV</button>
      <input id="csvIn" type="file" accept=".csv" />
      <button id="btnExport" class="btn-primary" type="button">↓ Export CSV</button>
    </div>
  </header>

  <div class="filters">
    <span class="filter-label">Filter</span>
    <select class="f" id="fTeam">
      <option value="">All teams</option>
    </select>
    <select class="f" id="fStatus">
      <option value="">All statuses</option>
      <option>Not started</option>
      <option>In development</option>
      <option>Done</option>
    </select>
    <select class="f" id="fUrgency">
      <option value="">All urgent</option>
      <option value="yes">Urgent</option>
      <option value="no">Not urgent</option>
    </select>
    <select class="f" id="fImportance">
      <option value="">All important</option>
      <option value="yes">Important</option>
      <option value="no">Not important</option>
    </select>
    <select class="f" id="fTime">
      <option value="">All time</option>
      <option>&lt;5m</option>
      <option>15m</option>
      <option>30m</option>
      <option>1h</option>
      <option>2h+</option>
    </select>
    <input class="search" id="fSearch" placeholder="Search tasks..." />
    <button id="btnSmart" class="btn-ghost push-right" type="button">Smart</button>
    <button id="btnDone" class="btn-ghost" type="button">Show done</button>
    <span id="statsLine" class="stats-line"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="col-drag"></th>
          <th class="col-name" data-sort="name">Task <span class="sort-arrow" id="sa-name"></span></th>
          <th class="col-status" data-sort="status">Status <span class="sort-arrow" id="sa-status"></span></th>
          <th class="col-team" data-sort="team">Team <span class="sort-arrow" id="sa-team"></span></th>
          <th class="col-important" data-sort="importance">Important <span class="sort-arrow" id="sa-importance"></span></th>
          <th class="col-urgent" data-sort="urgency">Urgent <span class="sort-arrow" id="sa-urgency"></span></th>
          <th class="col-time" data-sort="time_estimate">Time <span class="sort-arrow" id="sa-time_estimate"></span></th>
          <th class="col-deadline" data-sort="deadline">Deadline <span class="sort-arrow" id="sa-deadline"></span></th>
          <th class="col-notes">Notes</th>
          <th class="col-created" data-sort="created_at">Created <span class="sort-arrow" id="sa-created_at"></span></th>
          <th class="col-del"></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div id="toast"></div>

  <div id="teamOverlay" class="overlay">
    <div class="dialog">
      <h3>Add new team</h3>
      <input id="newTeamInput" placeholder="Team name..." />
      <div class="dialog-actions">
        <button id="btnCancelTeam" class="btn-ghost" type="button">Cancel</button>
        <button id="btnConfirmTeam" class="btn-primary" type="button">Add</button>
      </div>
    </div>
  </div>
</body>
</html>
