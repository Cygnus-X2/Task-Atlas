<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Atlas Login</title>
  <link rel="stylesheet" href="./assets/css/app.css" />
</head>
<body data-view="login">
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-brand">
        <p class="auth-eyebrow">Task Atlas</p>
        <h1>Sign in</h1>
        <p class="auth-copy">Use the account configured on the server to access the board, goals, week planner, and pages.</p>
      </div>

      <form id="loginForm" class="auth-form">
        <label class="dialog-field">
          <span>Username</span>
          <input id="loginUsername" name="username" autocomplete="username" placeholder="admin" required />
        </label>

        <label class="dialog-field">
          <span>Password</span>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Password" required />
        </label>

        <button id="loginSubmit" class="btn-primary" type="submit">Sign in</button>
        <p id="loginMessage" class="auth-message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script>
    (() => {
      const form = document.getElementById("loginForm");
      const usernameInput = document.getElementById("loginUsername");
      const passwordInput = document.getElementById("loginPassword");
      const submitButton = document.getElementById("loginSubmit");
      const message = document.getElementById("loginMessage");

      function nextTarget() {
        const next = new URLSearchParams(window.location.search).get("next") || "/index.html";
        if (!next.startsWith("/") || next.startsWith("//")) {
          return "/index.html";
        }
        return next;
      }

      function setMessage(text, isError) {
        message.textContent = text;
        message.classList.toggle("is-error", Boolean(isError));
      }

      async function loadSession() {
        try {
          const response = await fetch("/api/session", { cache: "no-store" });
          if (!response.ok) {
            return;
          }
          const payload = await response.json();
          if (!payload.auth_enabled || payload.authenticated) {
            window.location.replace(nextTarget());
            return;
          }
          if (payload.username) {
            usernameInput.value = payload.username;
          }
        } catch (error) {
          console.error(error);
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submitButton.disabled = true;
        setMessage("Signing in...", false);

        try {
          const response = await fetch("/api/session/login", {
            method: "POST",
            cache: "no-store",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: usernameInput.value.trim(),
              password: passwordInput.value,
            }),
          });

          if (!response.ok) {
            let errorMessage = "Could not sign in";
            try {
              const payload = await response.json();
              errorMessage = payload.error || errorMessage;
            } catch (error) {}
            setMessage(errorMessage, true);
            return;
          }

          window.location.replace(nextTarget());
        } catch (error) {
          console.error(error);
          setMessage("Could not reach the server", true);
        } finally {
          submitButton.disabled = false;
          passwordInput.focus();
          passwordInput.select();
        }
      });

      void loadSession();
      usernameInput.focus();
    })();
  </script>
</body>
</html>
